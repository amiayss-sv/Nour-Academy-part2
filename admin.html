        const STORAGE_KEY = "nour-academy-admin";
        const tableBody = document.querySelector("#parentsTableBody");
        const searchInput = document.querySelector("#input");

        let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || localStorage.setItem(STORAGE_KEY, JSON.stringify(tableData));

        function formatCourses(courses) {
           return  courses.join("\n");
        }


        function formatMoney(value) {
            const amount = Number(value);
            return amount + ".00 Dh"
        }

        function formatDate(value) {
            const date = new Date(`${value}T00:00:00`);
            return date.toLocaleDateString()
        }



        function renderTable(rows) {
            if (rows.length ===0) {
                tableBody.innerHTML = '<tr><td class="empty-row" colspan="12">Aucun dossier trouvé Add dosseir ....</td></tr>';
                return;
            }

            tableBody.innerHTML = rows.map(parent => {
                const actualChildren = parent.childs;
                const children = actualChildren ; 
                const rowSpan = children.length;
                const total = actualChildren.reduce((sum, child) => sum + (Number(child.prix)), 0);
                const payment = parent.paiement || "_";
                    console.log(children);
                    
                return children.map((child, index) => {
                    const parentCells = index === 0 ? `
                        <td rowspan="${rowSpan}">${(parent.dossier)}</td>
                        <td rowspan="${rowSpan}">
                            <span class="parent-name">${(parent.parent)}</span>
                            <span class="secondary-text">${parent.telephone}</span>
                        </td>
                    ` : "";

                    const childCells = `
                        <td>${child?.name }</td>
                        <td>${child?.niveau}</td>
                        <td>${(formatCourses(child.courses))}</td>
                        <td><span class="status-badge ${child?.status}">${child.status}</span></td>
                        <td>${formatDate(child.date)}</td>
                        <td>${formatMoney(child.prix)}</td>
                        <td>${child.centre || "-"}</td>
                    `;


                    const totalsCells = index === 0 ? `
                        <td rowspan="${rowSpan}">${formatMoney(total)}</td>
                        <td rowspan="${rowSpan}"><span class="status-badge ${payment}">${(payment)}</span></td>
                        <td rowspan="${rowSpan}">
                            <button type="button" class="action" data-dossier="${(parent.dossier)}" aria-label="Voir le dossier ${(parent.dossier)}" title="Voir le dossier">⋯</button>
                        </td>
                    ` : "";

                    return `<tr>${parentCells}${childCells}${totalsCells}</tr>`;
                }).join("");

            }).join("");
        }
        




        function filterTable() {
            const query = searchInput.value.trim().toLowerCase();
            const filteredData = data.filter(parent => {
                const childText = (Array.isArray(parent.childs) ? parent.childs : []).map(child => [
                    child.name,
                    child.niveau,
                    formatCourses(child.courses),
                    child.status,
                    child.date,
                    child.prix,
                    child.conter,
                    child.centre
                ].join(" ")).join(" ");

                const searchableText = [
                    parent.dossier,
                    parent.parent,
                    parent.telephone,
                    parent.center,
                    childText
                ].join(" ").toLocaleLowerCase("fr");

                return searchableText.includes(query);
            });
            renderTable(filteredData);
        }


        
        searchInput.addEventListener("input", filterTable);

        tableBody.addEventListener("click", event => {
            const button = event.target.closest("button.action");
            if (!button) return;

            const parent = data.find(item => item.dossier === button.dataset.dossier);
            if (!parent) return;

            const childCount = Array.isArray(parent.childs) ? parent.childs.length : 0;
            alert(
                `Dossier : ${parent.dossier}\n` +
                `Parent : ${parent.parent}\n` +
                `Téléphone : ${parent.telephone || "—"}\n` +
                `Nombre d'enfants : ${childCount}\n` +
                `Centre : ${parent.center || "—"}`
            );
        });
